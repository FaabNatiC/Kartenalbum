<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kartenalbum</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kartenalbum">

<meta name="theme-color" content="#0e121b" media="(prefers-color-scheme: dark)">

<script>try{var th=localStorage.getItem("pk-theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th);var dk=th==="dark"||(th!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.removeAttribute("media");m.setAttribute("content",dk?"#0e121b":"#e8ebf1");});var sb=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');if(sb)sb.setAttribute("content",dk?"black":"default");}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: iPhone-App mit Tab-Leiste unten (Alben · Pokédex · Suche · Mehr), Kopfzeile oben, Ordnerseiten mit 3×3 Taschen */
:root{
  --bg:#e8ebf1; --page:#f8f9fb; --pocket:#dfe3eb; --pocket-edge:#c9cfdb;
  --ink:#1a2030; --muted:#5f687c; --line:#cdd3de;
  --accent:#d3263b; --accent-ink:#ffffff;
  --frame:#f1c232; --stub:#fffaf0; --stub-ink:#2b2414;
  --bar:rgba(248,249,251,.92);
  --shadow:0 1px 2px rgba(20,28,48,.08),0 6px 18px rgba(20,28,48,.06);
  --f-display:"Archivo",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Chakra Petch",ui-monospace,"SF Mono",Menlo,monospace;
  --tabh:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e121b; --page:#161b27; --pocket:#1d2332; --pocket-edge:#2a3245;
  --ink:#e7ebf3; --muted:#97a0b5; --line:#2a3245;
  --accent:#ff5b6b; --accent-ink:#1a0207;
  --frame:#ddb02a; --stub:#2a2517; --stub-ink:#f3ead2;
  --bar:rgba(22,27,39,.92);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e121b; --page:#161b27; --pocket:#1d2332; --pocket-edge:#2a3245;
  --ink:#e7ebf3; --muted:#97a0b5; --line:#2a3245;
  --accent:#ff5b6b; --accent-ink:#1a0207;
  --frame:#ddb02a; --stub:#2a2517; --stub-ink:#f3ead2;
  --bar:rgba(22,27,39,.92);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);overflow-x:hidden;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow-x:hidden;overflow-x:clip;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopfzeile + Tab-Leiste */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent;margin-top:env(safe-area-inset-top,0px);transition:border-color .2s}
body.scrolled .bar{border-bottom-color:var(--line)}
body.nobar .bar{display:none}
body.nobar .wrap{padding-top:calc(env(safe-area-inset-top,0px) + 18px)}
.bar-in{max-width:1180px;margin:0 auto;min-height:56px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px}
.bar-title{font:700 17px var(--f-body);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.bar-back{justify-self:start;display:inline-flex;align-items:center;gap:2px;color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:999px;font:600 14.5px var(--f-body);padding:4px 12px 4px 6px;min-height:36px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);max-width:100%;white-space:nowrap}
.bar-back svg{width:18px;height:18px;color:var(--accent);flex:0 0 auto}
.wrap.swiping{transition:none}
.wrap{transition:transform .25s ease}
.edge-hint{position:fixed;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:0;z-index:40;pointer-events:none;transition:opacity .2s}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{display:grid;justify-items:center;align-content:center;gap:3px;text-decoration:none;color:var(--muted);font:600 11px var(--f-body);position:relative}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:7px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--page)}
#tools{display:contents}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px)}

/* Kopf der Ansichten */
h1{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(26px,6vw,36px);letter-spacing:-.01em;margin:0;line-height:1.05;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.sub b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:flex-end;margin-top:14px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-num);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grow{flex:1 1 200px;min-width:0;display:grid;gap:6px}
.bar-p{height:8px;border-radius:99px;background:var(--pocket);overflow:hidden;position:relative;display:block}
.bar-p i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:inherit;transition:width .4s}
.bar-p i.m{background:color-mix(in srgb,var(--accent) 35%,transparent)}
.note{font-size:13px;color:var(--muted);background:var(--page);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.hint{font-size:13px;color:var(--muted);margin:0}

/* Steuerung */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--pocket);border-radius:10px;padding:3px;margin-top:16px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);min-height:38px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--page);color:var(--ink);box-shadow:var(--shadow)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.pager span{font:600 13px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.pg{width:44px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--page);display:grid;place-items:center;cursor:pointer}
.pg svg{width:18px;height:18px}
.field{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.gens{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:10px;scrollbar-width:none}
.gen{flex:0 0 auto;border:1px solid var(--line);background:var(--page);border-radius:9px;padding:6px 10px;cursor:pointer;display:grid;gap:3px;text-align:left;min-width:82px}
.gen span{font:600 12px var(--f-body)}
.gen em{font:600 11px var(--f-num);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.gen .bar-p{height:4px}
.btn{border:1px solid var(--line);background:var(--page);color:var(--ink);font:600 14px var(--f-body);min-height:40px;padding:8px 14px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Regal */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,158px),1fr));gap:12px;margin-top:20px}
.cover.set{grid-template-rows:auto auto auto auto;min-height:0;padding:12px 12px 12px 32px;gap:8px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cover.set::before{width:22px;box-shadow:inset -3px 0 4px rgba(0,0,0,.18)}
.cover .ring2{position:absolute;left:5px;width:12px;height:12px;border-radius:50%;background:color-mix(in srgb,var(--spine) 55%,#000);border:2.5px solid color-mix(in srgb,var(--spine) 35%,#fff);z-index:1}
.cover .ring2.r1{top:28%}.cover .ring2.r2{top:64%}
.cover.set .bar-p i{background:var(--spine)}
.cover.set .bar-p i.m{background:color-mix(in srgb,var(--spine) 35%,transparent)}
.fan{position:relative;height:118px;margin:2px 0 4px}
.fc{position:absolute;bottom:0;left:50%;width:62px;aspect-ratio:63/88;border-radius:5px;overflow:hidden;background:var(--pocket);box-shadow:0 3px 10px rgba(0,0,0,.28);transform-origin:50% 100%}
.fc img{width:100%;height:100%;object-fit:cover;display:block}
.fc.f0{transform:translateX(-95%) rotate(-11deg)}
.fc.f1{transform:translateX(-50%) translateY(-6px);z-index:2}
.fc.f2{transform:translateX(-5%) rotate(11deg)}
.fc.ghost img{filter:grayscale(1);opacity:.45}
.logo{height:46px;display:grid;place-items:center}
.logo img{max-width:100%;max-height:46px;object-fit:contain}
.logo .logo-t{display:none;font:800 16px/1.15 var(--f-display);text-align:center}
.logo:not(:has(img)) .logo-t{display:block}
.cmeta{display:flex;align-items:center;gap:6px;font:600 11.5px var(--f-num);color:var(--muted);min-width:0}
.cmeta .sym{width:16px;height:16px;object-fit:contain}
.cmeta .v{margin-left:auto;color:var(--ink)}
.cover{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:8px;min-height:168px;padding:14px 16px 14px 26px;border-radius:6px 12px 12px 6px;background:var(--page);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:0;font:inherit;text-align:left;cursor:pointer;overflow:hidden}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--spine,var(--muted))}
.cover .ab{font:700 28px/1 var(--f-num);letter-spacing:.02em;color:var(--spine,var(--ink))}
.cover h2{margin:0;font-family:var(--f-display);font-stretch:110%;font-weight:800;font-size:19px;line-height:1.15}
.cover p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.cover .pr{display:grid;gap:5px;font:600 12px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.cover.dex{--spine:var(--accent)}
.cover.add{background:transparent;border:2px dashed var(--line);box-shadow:none;place-content:center;justify-items:center;text-align:center;color:var(--muted);grid-template-rows:auto auto}
.cover.add::before{display:none}
.cover.add b{font-size:34px;line-height:1;font-weight:400}

/* Ordner */
.binder{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:20px;margin-top:14px}
.page{background:var(--page);border-radius:6px 12px 12px 6px;box-shadow:var(--shadow);padding:12px 12px 10px 22px;position:relative;min-width:0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 60px)}
.page::before{content:"";position:absolute;left:7px;top:14%;bottom:14%;width:5px;background:radial-gradient(circle,var(--line) 2.5px,transparent 3px) 0 0/5px 33.3%}
.page h3{margin:0 0 8px;display:flex;justify-content:space-between;font:600 11px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pockets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.flat{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-top:14px}
.slot{aspect-ratio:63/88;max-width:100%;border-radius:6px;border:1px solid var(--pocket-edge);background:var(--pocket);position:relative;cursor:pointer;padding:0;color:var(--ink);font:inherit;display:block;width:100%;overflow:hidden;text-align:center}
.slot.secret{border:1px dashed color-mix(in srgb,var(--frame) 70%,var(--pocket-edge))}
.slot .no{position:absolute;inset:0;display:grid;place-content:center;gap:2px;padding:4px}
.slot .no b{font:700 clamp(15px,3.6vw,20px) var(--f-num);color:var(--muted);opacity:.55;font-variant-numeric:tabular-nums}
.slot .no span{font-size:clamp(9px,2.4vw,11px);color:var(--muted);line-height:1.15;overflow-wrap:anywhere}
.slot.owned{border:0;background:var(--frame);padding:5px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.slot img.cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.slot:not(.owned) img.cimg{filter:grayscale(1);opacity:.3}
.slot.loaded .no{display:none}
.slot.owned.loaded{background:transparent;padding:0;border-radius:5px}
.slot.owned.loaded .face{display:none}
.slot .tag{position:absolute;left:4px;bottom:4px;z-index:2;font:700 10px var(--f-num);background:var(--page);color:var(--muted);border-radius:4px;padding:1px 5px;font-variant-numeric:tabular-nums}
.face{position:absolute;inset:5px;border-radius:3px;background:var(--stub);color:var(--stub-ink);display:grid;grid-template-rows:auto 1fr;text-align:left;overflow:hidden}
.face .band{background:var(--tb,#9aa3b5);color:var(--ti,#fff);padding:4px 5px 3px;display:grid;gap:1px}
.face .nm{font:700 clamp(10px,2.6vw,12px)/1.1 var(--f-body);overflow-wrap:anywhere}
.face .dx{font:600 9.5px var(--f-num);opacity:.85}
.badge{position:absolute;right:4px;top:4px;background:var(--accent);color:var(--accent-ink);font:700 10px var(--f-num);border-radius:99px;padding:1px 6px;z-index:2}
.slot.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.sgrp{margin-top:18px}
.sgrp h3{margin:0 0 8px;font:700 15px var(--f-body);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sgrp h3 small{font:600 12px var(--f-num);color:var(--muted)}
.slot.res img.cimg{filter:none;opacity:1}
.slot.res{background:var(--pocket);padding:0;border:0}
.slot.res .have{position:absolute;right:4px;top:4px;z-index:2;background:#2f8a4e;color:#fff;font:700 10.5px var(--f-num);border-radius:99px;padding:2px 7px}
.res-cap{display:grid;gap:0;margin-top:5px;text-align:center;font-size:11.5px;line-height:1.25}
.res-cap b{font-weight:600;overflow-wrap:anywhere}
.res-cap span{font-family:var(--f-num);color:var(--muted)}
.res-lbl{display:block;font:600 11px var(--f-num);color:var(--muted);text-align:center;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dexhits{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* Bottom Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.5);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:52;margin:0 auto;width:min(640px,100%);height:calc(100dvh - env(safe-area-inset-top,0px) - 10px);background:var(--page);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform;touch-action:none}
.sheet.drag{transition:none}
.grab{flex:0 0 auto;display:grid;place-items:center;height:26px;cursor:grab}
.grab span{width:40px;height:5px;border-radius:99px;background:var(--line)}
.sheet-scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet.half .sheet-scroll{overflow-y:hidden}
body.locked{overflow:hidden}
dialog{border:0;padding:0;background:var(--page);color:var(--ink);border-radius:16px;width:min(580px,calc(100vw - 20px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow-x:hidden;overscroll-behavior:contain}
dialog::backdrop{background:rgba(10,14,24,.55)}
.dlg{display:grid;gap:16px;padding:4px 16px 20px}
.sheet .dlg{padding-top:0}
.sheet h2.sh-t{margin:0;font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:22px;padding-right:46px}
.big.art{aspect-ratio:1;width:min(55%,200px);object-fit:contain;background:transparent;box-shadow:none}
/* Pokédex-Artwork */
:root{--sil:brightness(0);--silo:.42}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sil:brightness(0) invert(1);--silo:.2}}
:root[data-theme="dark"]{--sil:brightness(0) invert(1);--silo:.2}
.slot.dexs{background:var(--pocket);border:1px solid var(--pocket-edge);padding:0}
.slot.dexs .art{position:absolute;left:8%;right:8%;top:10%;width:84%;aspect-ratio:1;object-fit:contain;z-index:1}
.slot.dexs:not(.owned) .art{filter:var(--sil);opacity:var(--silo)}
.slot.dexs.owned{background:color-mix(in srgb,var(--frame) 22%,var(--page));border:1.5px solid color-mix(in srgb,var(--frame) 70%,transparent);box-shadow:none}
.slot.dexs .dnm{position:absolute;left:0;right:0;bottom:6px;z-index:2;font:600 clamp(9px,2.4vw,11px)/1.15 var(--f-body);color:var(--muted);padding:0 4px;overflow-wrap:anywhere}
.slot.dexs.owned .dnm{color:var(--ink)}
.slot.dexs .dno{position:absolute;left:5px;top:4px;z-index:2;font:700 10px var(--f-num);color:var(--muted)}
/* Set-Kopf */
.sethead{display:grid;gap:12px;justify-items:center;text-align:center;margin-top:6px}
.slogo{height:64px;display:grid;place-items:center;max-width:min(100%,320px)}
.slogo img{max-height:64px;max-width:100%;object-fit:contain}
.slogo .logo-t{display:none;font:800 26px/1.1 var(--f-display);font-stretch:115%}
.slogo:not(:has(img)) .logo-t{display:block}
.ringrow{display:flex;align-items:center;gap:16px;width:min(100%,420px);text-align:left}
.ring{width:82px;height:82px;flex:0 0 auto}
.ring text{font:700 15px var(--f-num);fill:var(--ink)}
.kvs{flex:1;min-width:0;display:grid;gap:4px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:15;background:var(--bg);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:2px 10px}
.stick.shrunk{box-shadow:0 6px 10px -8px rgba(0,0,0,.35)}
.sethead{transform-origin:50% 0;will-change:transform,opacity}
.mini{display:flex;align-items:center;gap:10px;height:0;opacity:0;overflow:hidden;font-size:13px;margin-top:4px}
.mini .ring{width:30px;height:30px}
.mini .ring text{display:none}
.mlogo{height:26px;display:grid;place-items:center;min-width:0;flex:0 1 auto}
.mlogo img{max-height:26px;max-width:130px;object-fit:contain}
.mlogo .logo-t{display:none;font:700 14px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mlogo:not(:has(img)) .logo-t{display:block}
.mv{margin-left:auto;font:600 13px var(--f-num);color:var(--muted);white-space:nowrap}
.mv b{color:var(--ink)}
.fbtn.alb{gap:6px}

.segrow{display:flex;gap:8px;align-items:stretch;margin-top:10px}
.segrow .seg{flex:1;margin-top:0}
.fbtn{border:1px solid var(--line);background:var(--page);border-radius:10px;padding:0 12px;font:600 14px var(--f-body);display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:44px}
.fbtn svg{width:18px;height:18px}
.fbtn.on{border-color:var(--accent);color:var(--accent)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.fchips .chip{cursor:pointer}
.fgroup{display:grid;gap:8px}
.fgroup h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fopts{display:flex;flex-wrap:wrap;gap:6px}
.fopt{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font:600 13px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.fopt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cnt{font:600 13px var(--f-num);color:var(--muted);margin-top:12px}
.loadfail{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-content:center;gap:10px;text-align:center;padding:24px}
.loadfail b{font:700 19px var(--f-body)}.loadfail span{color:var(--muted)}.loadfail .btn{justify-self:center;margin-top:6px}
.recent-sec{margin-top:18px}
.rec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.rec-h h2{margin:0;font:700 17px var(--f-body)}
.lnk{border:0;background:none;color:var(--accent);font:600 14px var(--f-body);cursor:pointer;padding:6px 0}
.recent{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.recent>div{flex:0 0 104px;scroll-snap-align:start}
.pv-space{height:70px}
.pvbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 10px);z-index:22;display:flex;align-items:center;gap:12px;width:min(560px,calc(100vw - 24px));background:var(--page);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13.5px;color:var(--muted)}
.pvbar span{flex:1;min-width:0}
.pvbar b{color:var(--ink)}
.bar-more{justify-self:end;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--page);color:var(--ink);font:700 13px/1 var(--f-body);letter-spacing:1px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.menu-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:500 15.5px var(--f-body);text-align:left;cursor:pointer}
.menu-row:first-child{border-top:0}
.menu-row.red{color:var(--accent)}
.menu-row:disabled{opacity:.45;cursor:default}
.menu-row small{margin-left:auto;color:var(--muted);font:500 13px var(--f-body)}
.danger-box{display:grid;gap:12px;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:12px;padding:14px}
.danger-box p{margin:0;font-size:14.5px}
.btn.red{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fcnt{font:600 11px var(--f-num);opacity:.7;margin-left:2px}
.open-alb{margin-top:2px}
.open-alb svg,.fbtn.alb svg{width:19px;height:19px}
/* Album-Modus */
:root{--desk:#c9cfda}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#06080d}}
:root[data-theme="dark"]{--desk:#06080d}
.album{position:fixed;inset:0;z-index:45;background:var(--desk);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);touch-action:none;-webkit-user-select:none;user-select:none}
.al-top,.al-bot{display:flex;align-items:center;gap:10px;padding:8px 12px;transition:opacity .3s;z-index:3}
.al-top{justify-content:space-between}
.al-x{width:40px;height:40px;border-radius:50%;border:0;background:var(--page);color:var(--ink);font-size:21px;cursor:pointer;box-shadow:var(--shadow)}
.al-title{font:700 15px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center}
.al-pg{font:600 13px var(--f-num);color:var(--muted);white-space:nowrap;min-width:40px;text-align:right}
.al-stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
.al-nav{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--page);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.al-nav svg{width:20px;height:20px}
.al-bot input{flex:1;min-width:0;accent-color:var(--accent)}
.album.land .al-top,.album.land .al-bot{position:absolute;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);background:color-mix(in srgb,var(--desk) 82%,transparent)}
.album.land .al-top{top:env(safe-area-inset-top,0px)}
.album.land .al-bot{bottom:env(safe-area-inset-bottom,0px)}
.album.idle .al-top,.album.idle .al-bot{opacity:0;pointer-events:none}
.spread{display:flex;position:relative;perspective:2400px}
.apage{width:var(--pw);height:var(--ph);background:var(--page);padding:10px 10px 10px 20px;position:relative;box-shadow:0 4px 18px rgba(0,0,0,.25);border-radius:4px 12px 12px 4px;flex:0 0 auto}
.apage::before{content:"";position:absolute;left:7px;top:14%;bottom:14%;width:5px;background:radial-gradient(circle,var(--line) 2.5px,transparent 3px) 0 0/5px 33.3%}
.apage.lp{border-radius:12px 4px 4px 12px;padding:10px 20px 10px 10px;box-shadow:-4px 4px 18px rgba(0,0,0,.25),inset -10px 0 14px -10px rgba(0,0,0,.25)}
.apage.lp::before{left:auto;right:7px}
.apage.rp{box-shadow:4px 4px 18px rgba(0,0,0,.25),inset 10px 0 14px -10px rgba(0,0,0,.25)}
.apage h3{margin:0 0 4px;height:16px;display:flex;justify-content:space-between;font:600 10.5px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.apage .pockets{grid-template-columns:repeat(3,var(--cw));gap:var(--g)}
.apage .slot{width:var(--cw)}
.apage .slot .tag{font-size:9px}
.apage.blank{background:color-mix(in srgb,var(--page) 85%,var(--desk))}
.pk-empty{display:block;width:var(--cw);aspect-ratio:63/88;border-radius:6px;border:1px dashed var(--pocket-edge);opacity:.5}
.leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;z-index:5;pointer-events:none;will-change:transform}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(0)}
.leaf .face .apage{box-shadow:0 6px 24px rgba(0,0,0,.35)}
.leaf .back{transform:rotateY(180deg) translateZ(0)}
/* Suche leeren */
.qwrap{position:relative;margin-top:14px}
.qwrap .field{padding-right:46px}
.qclr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--pocket);color:var(--ink);font-size:18px;cursor:pointer}
/* Preis-Chips */
.pchips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 10px;font:600 12px var(--f-body);cursor:pointer;white-space:nowrap;min-height:30px}
.pchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pchip small{font:600 11px var(--f-num);opacity:.75;margin-left:4px}
/* Picker-Logo */
.prow .plogo{width:62px;height:30px;display:grid;place-items:center}
.prow .plogo img{max-width:62px;max-height:30px;object-fit:contain}
.prow .plogo .ab{display:none}
.prow .plogo:not(:has(img)) .ab{display:block}
.dlg-x{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;height:0;pointer-events:none}
.x{pointer-events:auto;border:0;background:var(--pocket);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
.big{display:block;width:min(100%,250px);aspect-ratio:63/88;margin:0 auto;border-radius:12px;object-fit:cover;background:var(--pocket);box-shadow:var(--shadow)}
.big.noimg{display:none}
.bigwrap{position:relative;width:min(100%,250px);margin:0 auto}
.bigwrap .big{width:100%;cursor:zoom-in}
.b3d{position:absolute;right:8px;bottom:8px;border:0;border-radius:999px;background:rgba(10,14,24,.72);color:#fff;font:700 12px var(--f-num);padding:6px 10px;cursor:pointer}
/* 3D-Ansicht */
.viewer{position:fixed;inset:0;z-index:70;background:rgba(6,8,13,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);touch-action:none;-webkit-user-select:none;user-select:none;opacity:0;transition:opacity .2s}
.viewer.on{opacity:1}
.v-x{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer}
.v-stage{touch-action:none;perspective:1100px;width:min(78vw,calc((100dvh - 180px) * 63 / 88),420px);aspect-ratio:63/88}
.c3d{position:relative;width:100%;height:100%;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform}
.c3d.spring{transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
.c3d .side{position:absolute;inset:0;border-radius:4.5%/3.3%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 20px 50px rgba(0,0,0,.55);background:#222}
.c3d .side img{width:100%;height:100%;object-fit:cover;display:block}
.c3d .backs{transform:rotateY(180deg)}
.glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.75),rgba(255,255,255,0) 55%)}
.holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.35;background:linear-gradient(var(--ga,115deg),transparent 20%,rgba(255,0,120,.5) 32%,rgba(255,220,0,.5) 42%,rgba(0,255,170,.5) 52%,rgba(0,140,255,.5) 62%,transparent 75%);background-size:220% 220%;background-position:var(--hp,50%) 50%}
.bdesign{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:12px;padding:12%;text-align:center;color:#fff;background:radial-gradient(circle at 50% 35%,#2b3550,#0f1320 70%);border:6px solid #c9a227;border-radius:inherit}
.bdesign img{max-width:85%;max-height:22%;object-fit:contain}
.bdesign b{font:800 clamp(18px,5vw,26px)/1.15 var(--f-display)}
.bdesign span{font:600 13px var(--f-num);opacity:.85}
.v-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.v-bar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
.v-bar .btn[aria-pressed="true"]{background:#fff;color:#111}
.v-hint{color:rgba(255,255,255,.6);font-size:12.5px;margin:0}
.dlg h2{margin:0;font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:24px;line-height:1.1;padding-right:46px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px/1.2 var(--f-body);padding:5px 10px;border-radius:999px;background:var(--pocket);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.chip.rare{background:#faeeda;color:#633806;border-color:#ef9f27}
.chip.type{background:var(--tb);color:var(--ti);border-color:transparent}
.chip.have{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip.none{color:var(--muted)}
.chip.link{cursor:pointer;min-height:34px}
.ticon{display:inline-block;width:16px;height:16px;border-radius:4px;background-repeat:no-repeat;background-position:0 50%;background-size:auto 16.2px;flex:0 0 auto;vertical-align:-3px}
.dmeta{margin:8px 0 0;font-size:13px;color:var(--muted)}
.dlinks{margin-top:10px}
.price{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;font-size:13px;color:var(--muted)}
.pmain{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px}
.pmain>div{display:grid;gap:3px;min-width:0}
.pinfo{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.pmain b{display:block;font-family:var(--f-num);color:var(--ink);font-variant-numeric:tabular-nums}
.pmain .now b{font-weight:700;font-size:32px;line-height:1.05;white-space:nowrap}
.pmain .ath{text-align:right}
.pmain .ath b{font-weight:700;font-size:20px;line-height:1.3;white-space:nowrap}
.pmain small{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.pmain em{font-style:normal;font-size:12px}
.sec-h{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* Varianten */
.vars{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.var{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.var:first-child{border-top:0}
.var .vn b{display:block;font-size:15px}
.var .vn small{font-size:12.5px;color:var(--muted);font-family:var(--f-num)}
.dtog{border:0;background:none;padding:2px 0 2px 6px;color:var(--accent);font:600 12.5px var(--f-body);cursor:pointer}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.step button{border:0;background:none;width:42px;height:40px;font-size:21px;line-height:1;cursor:pointer;color:var(--ink)}
.step button:disabled{opacity:.3}
.step span{min-width:28px;text-align:center;font:700 16px var(--f-num);font-variant-numeric:tabular-nums}
.step span.zero{color:var(--muted);font-weight:500}
.step.sm button{width:36px;height:34px;font-size:18px}
.step.sm span{min-width:24px;font-size:14px}
.det{grid-column:1/-1;background:var(--bg);border-radius:10px;padding:8px 10px;display:grid;gap:8px}
.bucket{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px}
.addb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
.addb select{font:16px var(--f-body);color:var(--ink);background:var(--page);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.more-btn{border:0;border-top:1px solid var(--line);background:none;padding:12px;text-align:left;color:var(--accent);font:600 14px var(--f-body);cursor:pointer}
.own{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}
.own .thumb{width:64px;aspect-ratio:63/88;border-radius:5px;background:var(--frame);position:relative;overflow:hidden;border:0;padding:0;cursor:pointer;display:grid;place-content:center;font:700 11px var(--f-num);color:#3b2f06}
.own .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.own h4{margin:0;font-size:14.5px}
.own p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.list{display:grid;gap:8px}
form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld.w{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted);font-weight:600}
.fld input,.fld select{font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.frow{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.msg{margin-right:auto;font-size:13px;color:var(--muted)}

/* Picker + Mehr */
.plist{display:grid;gap:14px}
.plist h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grp{display:grid;gap:6px}
.prow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--page);border-radius:10px;padding:10px;text-align:left;cursor:pointer;font:inherit}
.prow:disabled{opacity:.55;cursor:default}
.prow .ab{font:700 14px var(--f-num)}
.prow b{font-size:14px;display:block}
.prow small{color:var(--muted);font:500 12px var(--f-num)}
.prow em{font-style:normal;font-size:12px;color:var(--muted)}
.stack{display:grid;gap:14px;margin-top:18px;max-width:680px}
.card-s{background:var(--page);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:10px}
.card-s h2{margin:0;font:700 17px var(--f-display)}
.card-s ul{margin:4px 0 0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.ver small{font:600 12px var(--f-num);color:var(--muted);margin-left:6px}
.foot{margin-top:28px;font-size:12px;color:var(--muted)}
.set-sec{display:grid;gap:6px;margin-top:22px;max-width:680px}
.set-sec>h2{margin:0 0 0 14px;font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.group{background:var(--page);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.srow{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;color:var(--ink);font:500 15px var(--f-body);cursor:pointer;text-decoration:none}
.group>.srow:first-child,.group>:first-child .srow{border-top:0}
.srow .lbl{flex:1;min-width:0}
.srow .val{color:var(--muted);font:500 14px var(--f-body);white-space:nowrap}
.srow .chev{color:var(--muted);font-size:18px;line-height:1}
.srow select{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--muted);font:500 15px var(--f-body);text-align:right;text-align-last:right;padding:8px 0;cursor:pointer;max-width:55%}
.srow.act{color:var(--accent)}
.srow:disabled{opacity:.5;cursor:default}
.srow.seg-row{display:block;padding:8px}
.srow.seg-row .seg{margin:0}
.sfoot{margin:0 14px;font-size:12.5px;color:var(--muted)}
.srow .sin{flex:1.4;min-width:0;border:0;background:transparent;color:var(--ink);font:500 15px var(--f-body);text-align:right;padding:8px 0;outline:none}
.srow .sin::placeholder{color:var(--muted);opacity:.7}
.acct-btns{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 4px 0}
.acct-or{display:flex;align-items:center;gap:10px;margin:10px 4px 2px;color:var(--muted);font-size:12.5px}
.acct-or::before,.acct-or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 4px 0;width:calc(100% - 8px);background:var(--page);font-weight:600}
.gbtn svg{width:18px;height:18px}
.tips{margin:0;padding:10px 14px 12px 32px;display:grid;gap:8px;font-size:14px}
.logv{display:grid;gap:4px;padding:4px 0}
.logv b{font-size:15px}

.sub .lpill,.lpill{display:inline-block;color:var(--bg);font-family:var(--f-body);font:700 11.5px var(--f-body);background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 7px;margin-right:4px;vertical-align:1px}
.lang-opts{display:grid;gap:8px}
.lopt{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}
.lopt b{font-size:16px}.lopt small{color:var(--muted);font-size:12.5px}
.lopt.on{border-color:var(--accent)}.lopt:disabled{opacity:.5;cursor:default}
#p-lang{margin-bottom:10px}
.wgh{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--page);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.wgh .wgt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgh .wgt b{font:700 15.5px var(--f-body)}.wgh .wgt small{color:var(--muted);font:600 12px var(--f-num)}
.wgh>small{font:600 12.5px var(--f-num);color:var(--muted);white-space:nowrap}
.wgh .hi{font-style:normal;color:var(--accent)}
.wchev{color:var(--muted);font-size:20px;transition:transform .2s}
.wgrp.open .wchev{transform:rotate(90deg)}
.wgrp{margin-top:10px}

.dsub{margin:2px 0 0;font:600 15px var(--f-body);color:var(--muted)}
.sub.jn{margin-top:0;font-size:13px}
.prow small.jn{display:block;color:var(--muted)}
.sqwrap{margin-top:8px}

.wrap{position:relative}
.scan-btn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 22px);z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--page);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.scan-btn svg{width:22px;height:22px}
body:not(.nobar) .scan-btn{display:none}
.bar-r{display:inline-flex;gap:8px;justify-self:end}
.bar-r .bar-more{display:grid;place-items:center}
.scanner{position:fixed;inset:0;z-index:75;background:#05070b;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sc-top{display:flex;align-items:center;gap:12px;padding:10px 14px;font:600 14px var(--f-body)}
.sc-stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;display:grid;place-items:center}
.sc-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-frame{position:relative;height:min(62%,420px);aspect-ratio:63/88;border:3px solid rgba(255,255,255,.9);border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.sc-frame::after{content:"";position:absolute;left:0;bottom:0;width:70%;height:16%;border:2px dashed #f2c94c;border-radius:0 8px 0 10px}
.sc-hint{position:absolute;left:6px;bottom:17%;font:700 11px var(--f-body);color:#f2c94c;text-shadow:0 1px 2px #000}
.sc-panel{background:var(--page);color:var(--ink);border-radius:18px 18px 0 0;padding:12px 14px 14px;display:grid;gap:10px;max-height:46vh;overflow:auto}
.sc-status{margin:0;font:600 13.5px var(--f-body);color:var(--muted);min-height:18px}
.sc-manual{display:flex;gap:8px}.sc-manual .field{flex:1}
.sc-list{display:grid;gap:8px}
.scrow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:6px 8px}
.scimg{flex:0 0 38px;aspect-ratio:63/88;border-radius:4px;overflow:hidden;background:var(--pocket)}
.scimg .cimg{width:100%;height:100%;object-fit:cover;filter:none;opacity:1}
.sct{flex:1;min-width:0;display:grid}.sct b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sct small{font:600 12px var(--f-num);color:var(--muted)}
.scv{max-width:42%;border:1px solid var(--line);border-radius:8px;background:var(--page);color:var(--ink);font:13px var(--f-body);padding:6px}
@media (min-width:900px){.scanner{left:var(--side)}.scan-btn{top:30px;right:36px}}

button.tab{border:0;background:none;padding:0;cursor:pointer;width:100%;font:600 11px var(--f-body);color:var(--muted)}
@media (max-width:899px){.tabbar nav{grid-template-columns:repeat(var(--n,5),minmax(0,1fr))}.tab{order:var(--o,0);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tab.hid{display:none}}
@media (min-width:900px){.mob-only{display:none}button.tab{font:600 15px var(--f-body);color:var(--ink);text-align:left;padding:11px 12px}}
.srico{display:grid;place-items:center;width:22px;color:var(--muted)}.srico svg{width:20px;height:20px}
.tabcfg{display:grid;gap:8px}
.tcrow{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px}
.tctog{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:600 15px var(--f-body);text-align:left;padding:6px;cursor:pointer}
.tctog svg{width:22px;height:22px;color:var(--muted)}
.tcchk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font:800 13px var(--f-body);color:var(--accent-ink)}
.tcrow.on .tcchk,.tcrow.fixed .tcchk{background:var(--accent);border-color:var(--accent)}
.tcrow:not(.on):not(.fixed) .tctog{color:var(--muted)}
.tcchk.lock{background:var(--ink)!important;border-color:var(--ink)!important;color:var(--bg)}
.tcchk.lock svg{width:12px!important;height:12px!important;color:var(--bg)!important;opacity:1!important}
.tcrow.fixed small{color:var(--muted);font-size:12px;padding-right:8px}
.tcmv{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--page);color:var(--ink);font:700 16px var(--f-body);cursor:pointer}
.tcmv:disabled{opacity:.35}
.hchips{display:flex;flex-wrap:nowrap;gap:5px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.hchips::-webkit-scrollbar{display:none}
.sethead .hchips{margin-bottom:12px}
.hchips>:first-child{margin-left:auto}.hchips>:last-child{margin-right:auto}
.hc{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font:600 11px var(--f-body);padding:2px 6px;letter-spacing:-.01em;border-radius:99px;background:var(--page);color:var(--muted);border:1px solid var(--line)}
.hc.l{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.top3{display:grid;gap:8px;width:min(100%,420px)}
.t3h{display:flex;align-items:center;justify-content:space-between}
.t3h b{font:700 14px var(--f-body)}.t3h>small{color:var(--muted);font-size:12px}
.t3tog{display:inline-flex;background:var(--pocket);border-radius:7px;padding:2px}
.t3tog button{border:0;background:none;color:var(--muted);font:600 11px var(--f-body);padding:3px 8px;border-radius:5px;cursor:pointer;min-height:0}
.t3tog button[aria-pressed="true"]{background:var(--page);color:var(--ink);box-shadow:var(--shadow)}
.t3row{display:flex;justify-content:center;align-items:flex-end;gap:10px}
.t3c{display:grid;justify-items:center;gap:3px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;padding:0;width:84px}
.t3c.first{width:102px}
.t3img{position:relative;display:block;width:100%;aspect-ratio:63/88;border-radius:6px;overflow:hidden;background:var(--pocket);box-shadow:0 6px 14px rgba(0,0,0,.18)}
.t3img .cimg{width:100%;height:100%;object-fit:cover;filter:none;opacity:1}
.t3c.miss .t3img .cimg{filter:grayscale(1) brightness(.75)}
.t3img i{position:absolute;left:4px;top:4px;font:700 11px var(--f-num);font-style:normal;background:var(--ink);color:var(--bg);border-radius:99px;padding:0 6px}
.t3c b{font:700 13px var(--f-num)}.t3c small{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t3msg{margin:0;text-align:center}.t3load{justify-self:center}
.fsel{position:relative;flex:1;min-width:0}
.fsel select{appearance:none;-webkit-appearance:none;width:100%;height:44px;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:10px;padding:0 34px 0 14px;font:600 15px var(--f-body);cursor:pointer}
.fsel::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.logo .logo-t,.slogo .logo-t{color:var(--spine,var(--ink));line-height:1.1}
.logo-t small{display:block;font:600 11px var(--f-num);color:var(--muted);margin-top:3px;font-stretch:100%}
.slogo .logo-t small{font-size:13px}
.mlogo .logo-t small{display:none}
.cimg.artfb{object-fit:contain;padding:22% 10%;background:var(--page);box-sizing:border-box}
.imgnote{margin:0;text-align:center;font-size:12px;color:var(--muted)}
.big.art{object-fit:contain;background:var(--pocket);border-radius:12px;padding:12%}

/* ---------- Desktop / großer Bildschirm (ab 900 px) ---------- */
.side-brand,.side-sum,.kbd,.pnav,.desk-only{display:none}
@media (hover:hover) and (pointer:fine){
  .slot{transition:transform .15s,box-shadow .15s}
  .slot:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(20,28,48,.18)}
  .cover{transition:transform .15s,box-shadow .15s}
  .cover:hover{transform:translateY(-3px)}
  .btn:hover,.fbtn:hover,.chip:hover,.fopt:hover{filter:brightness(.97)}
}
@media (min-width:900px){
  :root{--tabh:0px;--side:236px}
  html{scrollbar-gutter:stable}
  body{padding-left:var(--side)}
  body.panel{padding-right:400px}
  body::before{display:none}
  .tabbar{top:0;bottom:0;right:auto;width:var(--side);box-sizing:border-box;border-top:0;border-right:1px solid var(--line);background:var(--page);-webkit-backdrop-filter:none;backdrop-filter:none;padding:24px 14px;display:flex;flex-direction:column;gap:18px}
  .tabbar nav{display:flex;flex-direction:column;gap:4px;height:auto;max-width:none;margin:0;padding:0}
  .tab{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font:600 15px var(--f-body);color:var(--ink)}
  .tab svg{width:21px;height:21px;color:var(--muted)}
  .tab:hover{background:var(--pocket)}
  .tab[aria-current="page"]{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
  .tab[aria-current="page"] svg{color:var(--accent)}
  .tab .dot{position:static;margin-left:auto}
  .kbd{display:inline-block;margin-left:auto;font:600 12px var(--f-num);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
  .desk-only{display:block}
  .side-brand{display:flex;align-items:center;gap:10px;padding:0 8px}
  .side-brand img{width:34px;height:34px;border-radius:9px}
  .side-brand b{font:800 17px var(--f-body)}
  .side-sum{display:grid;gap:2px;margin-top:auto;padding:14px;border-radius:12px;background:var(--bg)}
  .side-sum small{font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .side-sum b{font:700 20px var(--f-num)}
  .side-sum span{font:600 14px var(--f-num);color:var(--muted)}
  .wrap{max-width:1400px;padding-left:36px;padding-right:36px;padding-bottom:48px}
  body.nobar .wrap{padding-top:32px}
  .bar-in{max-width:1400px;padding-left:36px;padding-right:36px}
  .stick{margin-inline:-36px;padding-inline:36px}
  .shelf{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px}
  .flat{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:14px}
  .sethead{grid-template-columns:auto auto;justify-content:start;justify-items:start;text-align:left;column-gap:36px;align-items:center}
  .sethead .sub,.sethead .hchips,.sethead .top3{grid-column:1 / -1}
  .sethead .hchips{margin-inline:0;padding-inline:0}
  .sethead .hchips>:first-child{margin-left:0}
  .segrow{max-width:720px}
  .recent{margin-inline:0;padding-inline:0}
  .pvbar{left:calc(50% + var(--side) / 2)}
  body.panel .pvbar{left:calc(50% + (var(--side) - 400px) / 2)}
  .toast{left:calc(50% + var(--side) / 2);bottom:24px}
  .sheet{left:var(--side)}
  #dlg{left:auto;right:0;top:0;bottom:0;margin:0;width:400px;height:100dvh;border-radius:0;border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(20,28,48,.10);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);touch-action:auto}
  #dlg .grab{display:none}
  #dlg .sheet-scroll{overflow-y:auto;padding-top:16px;scrollbar-width:thin}
  #dlg .dlg-x{display:flex;align-items:center;gap:8px;height:auto;position:sticky;top:-16px;background:var(--page);padding:8px 0;margin-top:-8px}
  .pnav{display:flex;align-items:center;gap:6px;flex:1}
  .pnav .x{position:static;display:grid;place-items:center}
  .pnav .x svg{width:16px;height:16px}
  .pnav small{font:600 12px var(--f-num);color:var(--muted);margin-left:6px}
  .slot.sel{outline:2px solid var(--accent);outline-offset:2px}
  .album{left:var(--side)}
  body.panel .album{right:400px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function migrate(list){
  const LBL2KEY = {"Normal":"normal","Holo":"holo","Reverse Holo":"reverse"};
  const out = new Map(), free = [];
  for(const e of list){
    if(!e) continue;
    const c = e.setId ? cardAt(e.setId, e.num) : null;
    if(!c){ if(e.setId) free.push({...e}); else if(e.dex || e.set) free.push({...e, qty: Math.max(1, +e.qty||1)}); continue; }
    const vs = cardVariants(c);
    let v = e.v;
    if(!v || !vs.includes(v)){ const want = LBL2KEY[e.variant]; v = want && vs.includes(want) ? want : (!want && e.variant && vs.find(k=>!vMain(k))) || vs[0]; }
    const lang = e.lang || "Deutsch", cond = e.cond || "Near Mint";
    const k = [e.setId,e.num,v,lang,cond].join("|");
    const prev = out.get(k);
    if(prev) prev.qty += Math.max(1, +e.qty||1);
    else out.set(k, {id: e.id || rid(), setId:e.setId, num:e.num, dex:c[7]||0, v, lang, cond, qty: Math.max(1, +e.qty||1), val: +e.val||0, priceDate: e.priceDate || ""});
  }
  return [...out.values(), ...free];
}

/* ---------- TCGdex-API: Bild + Preise je Variante ---------- */
const API = "https://api.tcgdex.net/v2";
const infoCache = new Map(), lastInfo = new Map();
function cardInfo(s, num, preferEn){
  const k = s.id + "|" + num + (preferEn ? "|en" : "");
  if(infoCache.has(k)) return infoCache.get(k);
  const get = async l => { const r = await fetch(`${API}/${l}/cards/${encodeURIComponent(s.id + "-" + num)}`); if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); };
  const p = (async () => {
    const first = s.ja ? "ja" : preferEn ? "en" : "de", second = s.ja ? null : preferEn ? "de" : "en";
    let a = null, b = null;
    try { a = await get(first); } catch {}
    if(!a?.image && second){ try { b = await get(second); } catch {} }
    const src = a || b;
    if(!src) throw new Error("Karte bei TCGdex nicht gefunden");
    const keys = cardVariants(cardAt(s.id, num));
    const vd = Array.isArray(src.variants_detailed) ? src.variants_detailed : [];
    const base = src.pricing?.cardmarket || null;
    const normalId = vd.find(x=>x?.type==="normal")?.thirdParty?.cardmarket;
    const vprice = {}, vavg = {}, vpeak = {}, vcm = {};
    const peakOf = (o, holo) => Math.max(0, ...["avg1","avg7","avg30"].map(k=>(holo ? o?.[k+"-holo"] : o?.[k]) || 0));
    keys.forEach((key, i) => {
      const d = vd.length === keys.length ? vd[i] : null;
      const pc = d?.pricing?.cardmarket || null;
      const rev = key.startsWith("reverse");
      let v = 0;
      if(pc){ v = rev && (!normalId || d.thirdParty?.cardmarket === normalId) && pc["trend-holo"] ? pc["trend-holo"] : (pc.trend || pc.avg || 0); }
      let a30 = pc ? (rev && (!normalId || d.thirdParty?.cardmarket === normalId) && pc["avg30-holo"] ? pc["avg30-holo"] : (pc.avg30 || 0)) : 0;
      if(!v && base){ v = rev ? (base["trend-holo"] || 0) : (vMain(key) ? (base.trend || base.avg || 0) : 0); a30 = rev ? (base["avg30-holo"] || 0) : (vMain(key) ? (base.avg30 || 0) : 0); }
      const holoSrc = rev && (!normalId || d?.thirdParty?.cardmarket === normalId) && pc?.["trend-holo"];
      const pk = pc && (pc.trend || pc.avg || pc["trend-holo"]) ? peakOf(pc, !!holoSrc) : (base ? (rev ? peakOf(base, true) : vMain(key) ? peakOf(base, false) : 0) : 0);
      vprice[key] = v; vavg[key] = a30; vpeak[key] = v ? pk : 0; vcm[key] = (d?.thirdParty?.cardmarket || pc?.idProduct || base?.idProduct || 0);
    });
    return { image: a?.image || b?.image || null, price: base, vprice, vavg, vpeak, vcm, cm: base?.idProduct || normalId || 0 };
  })();
  infoCache.set(k, p); p.catch(() => infoCache.delete(k));
  return p;
}
function applyPrices(setId, num, info){
  let changed = false;
  const day = (info.price?.updated || new Date().toISOString()).slice(0,10);
  cards = cards.map(c => {
    if(c.setId!==setId || c.num!==num) return c;
    const v = Math.round((info.vprice[c.v] || 0)*100)/100, a30 = Math.round((info.vavg?.[c.v] || 0)*100)/100;
    if(!v || (v===c.val && a30===(c.a30||0))) return c;
    changed = true; return {...c, val:v, a30, priceDate:day};
  });
  if(changed) saveCards();
  return changed;
}
function priceHist(){ try{ return JSON.parse(LS.raw("pk-pricehist")||"{}"); }catch{ return {}; } }
function recordPrice(key, p){
  if(!p) return null;
  const h = priceHist(), today = (p.updated || new Date().toISOString()).slice(0,10), cur = h[key];
  const cands = [p.trend, p.peak || 0]; if(!cur && p.avg30) cands.push(p.avg30);
  if(!p.trend && !cur) return null;
  // erster Abruf: die 30-Tage-Durchschnitte decken die letzten 30 Tage mit ab
  const since = p.peak || p.avg30 ? new Date(new Date(today).getTime() - 30*864e5).toISOString().slice(0,10) : today;
  const best = cur ? {...cur} : {max:0, d:today, since};
  for(const v of cands) if(v && v > best.max){ best.max = v; best.d = today; }
  h[key] = best; LS.put("pk-pricehist", JSON.stringify(h));
  return best;
}

/* ---------- Bestand ändern ---------- */
function bucketsOf(setId, num, v){ return cards.filter(c=>c.setId===setId && c.num===num && c.v===v && qtyOf(c)); }
function changeQty(setId, num, v, lang, cond, delta){
  const c = cardAt(setId, num); if(!c) return;
  const i = cards.findIndex(e=>e.setId===setId && e.num===num && e.v===v && e.lang===lang && e.cond===cond);
  if(i<0){
    if(delta<=0) return;
    const info = lastInfo.get(setId+"|"+num);
    cards.push({id:rid(), setId, num, dex:c[7]||0, v, lang, cond, qty:delta, val: info ? Math.round((info.vprice[v]||0)*100)/100 : 0, a30: info ? Math.round((info.vavg?.[v]||0)*100)/100 : 0, priceDate: info?.price?.updated?.slice(0,10) || ""});
  } else {
    const q = qtyOf(cards[i]) + delta;
    if(q<=0) cards.splice(i,1); else cards[i] = {...cards[i], qty:q};
  }
  if(delta>0 && wish[wishKey(setId, num)]){ delete wish[wishKey(setId, num)]; saveWish(); toast(`<span>Von der Wunschliste entfernt</span><button class="tx" type="button" data-tclose aria-label="Schließen">×</button>`, 2200); }
  const vlq = view.name==="set" && view.set.id===setId ? view.lang : null;
  if(delta>0 && !albums.some(a=>a.setId===setId && (a.lang||null)===(vlq||null))){ albums.push({id:slugOf(setId)+(vlq?"~"+vlq:""), setId, ...(vlq?{lang:vlq}:{}), created:new Date().toISOString()}); LS.set("pk-albums", albums); }
  saveCards(); render();
}
function stepVariant(setId, num, v, delta){
  if(delta>0) return changeQty(setId, num, v, defLang(setId), settings.cond, 1);
  const bs = bucketsOf(setId, num, v); if(!bs.length) return;
  const b = bs.find(x=>x.lang===defLang(setId) && x.cond===settings.cond) || bs.slice().sort((a,b)=>qtyOf(b)-qtyOf(a))[0];
  changeQty(setId, num, v, b.lang, b.cond, -1);
}

const localDay = () => { const d = new Date(), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
function recordValue(){
  if(!cards.length && !Object.keys(valHist).length) return;
  const d = localDay(), v = Math.round(sum(cards,valOf)*100)/100;
  if(valHist[d] !== v){ valHist[d] = v; LS.set("pk-valhist", valHist); }
  const per = {}; for(const c of cards){ const x = valOf(c); if(!x || !c.setId) continue; const o = per[c.setId] ||= {}; o[c.lang||"?"] = Math.round(((o[c.lang||"?"]||0) + x)*100)/100; }
  const sv = LS.get("pk-setval", {}); let ch = false;
  for(const [sid, o] of Object.entries(per)){ const h = sv[sid] ||= {}; if(JSON.stringify(h[d]) !== JSON.stringify(o)){ h[d] = o; ch = true; } }
  for(const [sid, h] of Object.entries(sv)) if(!per[sid] && h[d]){ delete h[d]; ch = true; }
  if(ch){ const cut = new Date(Date.now() - 400*864e5).toISOString().slice(0,10); for(const h of Object.values(sv)) for(const k of Object.keys(h)) if(k < cut) delete h[k]; LS.put("pk-setval", JSON.stringify(sv)); }
}
function chartSVG(pts){
  const W = 600, H = 200, pl = 8, pr = 8, pt = 14, pb = 26;
  if(pts.length < 2) return "";
  const vs = pts.map(p=>p[1]), mn = Math.min(...vs), mx = Math.max(...vs), span = (mx - mn) || Math.max(1, mx*0.1);
  const lo = mn - span*0.15, hi = mx + span*0.15;
  const x = i => pl + i*(W-pl-pr)/(pts.length-1), y = v => pt + (1-(v-lo)/(hi-lo))*(H-pt-pb);
  const line = pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p[1]).toFixed(1)}`).join(" ");
  const area = `${line} L${x(pts.length-1).toFixed(1)} ${H-pb} L${x(0).toFixed(1)} ${H-pb} Z`;
  const lab = i => deDate(pts[i][0]).slice(0,6);
  return `<svg class="vchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf des Sammlungswerts von ${eur(vs[0])} auf ${eur(vs[vs.length-1])}">
    <path d="${area}" fill="color-mix(in srgb,var(--accent) 12%,transparent)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(pts.length-1).toFixed(1)}" cy="${y(vs[vs.length-1]).toFixed(1)}" r="4.5" fill="var(--accent)"/>
    <text x="${pl}" y="${H-6}" class="vlab">${lab(0)}</text><text x="${W-pr}" y="${H-6}" class="vlab" text-anchor="end">${lab(pts.length-1)}</text></svg>`;
}

function achStats(){

  const dex = new Set(), types = new Set(), setIds = new Set(), keys = new Set(), tk = {};

    if(e.setId){ setIds.add(e.setId); const k = e.setId+"|"+e.num; keys.add(k); const c = cardAt(e.setId, e.num); if(c){ st.rar.add(c[3]); if(c[4]==="P" && c[5]){ types.add(c[5]); (tk[c[5]] ||= new Set()).add(k); } if(c[7]) dex.add(c[7]); } }
  }
  for(const id of setIds){ const s = SET.get(id); if(!s) continue; const p = setProgress(s, setOwned(s)); if(p.base >= p.baseTotal && p.baseTotal) st.setsDone++; if(p.all >= p.allTotal && p.allTotal) st.master++; }

  return st;
}

  else if(shape==="hex") o = poly(6, 94);
  else if(shape==="oct") o = poly(8, 94, -Math.PI/2 + Math.PI/8);
  else if(shape==="shield") o = [[100,6],[184,28],[182,104],[150,160],[100,194],[50,160],[18,104],[16,28]];
  else if(shape==="star") o = Array.from({length:24},(_,i)=>{ const a = Math.PI*i/12 - Math.PI/2, r = i%2 ? 80 : 96; return [100+r*Math.cos(a), 100+r*Math.sin(a)]; });

  for(const s of SETS){ for(const k of new Set([s.abbr, s.id].filter(Boolean).map(x=>String(x).toUpperCase()))){ if(!m.has(k)) m.set(k, []); m.get(k).push(s); } }

}
function findNum(s, n){
  if(!s || !n) return null;
  if(s.idx.has(n)) return n;
  const z = n.replace(/^0+/, "");
  for(const c of s.cards) if(c[0].replace(/^0+/, "") === z) return c[0];

/* Erkannten Text auswerten: Set-Kürzel + Nummer (z. B. "PRE EN 002/131", "SV7a 019/064", "SVP EN 085") */
function parseScan(text, ctxSet){
  const t = String(text||"").replace(/[|]/g,"/").replace(/\s+/g," ").trim();
  const m = t.match(/(\d{1,3})\s*\/\s*(\d{2,3})/);
  const tokens = t.toUpperCase().split(/[^A-Z0-9.]+/).filter(x=>x.length>=2 && x.length<=7);
  const am = abbrMap();
  let codeSets = [];
  for(const tk of tokens){ if(am.has(tk)) codeSets = codeSets.concat(am.get(tk)); }
  const out = [];
  const add = (s, num) => { const n = findNum(s, num); if(n && !out.some(x=>x.s===s && x.num===n)) out.push({s, num:n}); };
  if(m){
    const num = m[1], tot = +m[2];
    if(ctxSet){ if(!tot || Math.abs(ctxSet.off - tot) <= 2 || !codeSets.length) add(ctxSet, num); }
    for(const s of codeSets) add(s, num);
    if(!out.length && !ctxSet) for(const s of SETS) if(s.off === tot && !s.promo) add(s, num);
    out.sort((a,b)=>(a.s===ctxSet?-1:0)-(b.s===ctxSet?-1:0) || Math.abs(a.s.off-tot)-Math.abs(b.s.off-tot));
  } else {
    const pm = t.match(/\b([A-Za-z]{1,4}[0-9.]*[A-Za-z]?)\s*(?:EN|DE|JP)?\s*(\d{1,3})\b/);
    if(pm){ const ss = am.get(pm[1].toUpperCase()) || []; for(const s of ss) add(s, pm[2]); if(ctxSet && !ss.length) add(ctxSet, pm[2]); }
  }
  return out.slice(0, 3);
}
async function openScanner(ctxSet, ctxLang){

async function scTick(){
  if(!SC.open || SC.busy || !SC.worker || !scVideo.videoWidth){ scLoop(); return; }
  SC.busy = true;
  try{
    const vw = scVideo.videoWidth, vh = scVideo.videoHeight, fr = $("#sc-frame").getBoundingClientRect(), vr = scVideo.getBoundingClientRect();
    const scale = Math.max(vr.width / vw, vr.height / vh), ox = (vr.width - vw*scale)/2, oy = (vr.height - vh*scale)/2;
    const fx = (fr.left - vr.left - ox)/scale, fy = (fr.top - vr.top - oy)/scale, fw = fr.width/scale, fh = fr.height/scale;
    const sx = Math.max(0, fx), sy = Math.max(0, fy + fh*0.84), sw = Math.min(vw - sx, fw*0.7), sh = Math.min(vh - sy, fh*0.16);
    const cv = document.createElement("canvas"), k = Math.max(1, 900 / sw); cv.width = Math.round(sw*k); cv.height = Math.round(sh*k);
    const g = cv.getContext("2d"); g.filter = "grayscale(1) contrast(1.6)"; g.drawImage(scVideo, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    const {data} = await SC.worker.recognize(cv);
    const hits = parseScan(data.text, SC.set);
    if(hits.length){
      const key = hits[0].s.id + "|" + hits[0].num;
      if(key !== SC.last || Date.now() - SC.lastAt > 6000){ SC.last = key; SC.lastAt = Date.now(); addScanHit(hits[0], hits.slice(1)); }

let top3Mode = null, spLoading = null;
const todayISO = () => localDay();
function setPrices(s){ return LS.get("pk-setprices", {})[s.id] || null; }
async function loadSetPrices(s, lang){
  if(spLoading) return; spLoading = {id:s.id, done:0, total:s.cards.length};
  const res = {}, mins = {}, queue = s.cards.map(c=>c[0]);
  const prog = () => { const el = $("#t3-prog"); if(el) el.textContent = `Preise werden geladen … ${spLoading.done} / ${spLoading.total}`; };
  const worker = async () => { while(queue.length){ const num = queue.shift(); try{ const info = await cardInfo(s, num, lang==="en"); const vs = Object.values(info.vprice||{}).map(x=>+x||0).filter(x=>x>0); if(vs.length){ res[num] = Math.round(Math.max(...vs)*100)/100; mins[num] = Math.round(Math.min(...vs)*100)/100; } }catch{} spLoading.done++; prog(); } };
  prog();
  try{ await Promise.all([worker(), worker(), worker(), worker()]); }
  finally{
    const all = LS.get("pk-setprices", {}); if(Object.keys(res).length) all[s.id] = {d: todayISO(), p: res, m: mins}; LS.put("pk-setprices", JSON.stringify(all));
    spLoading = null; if((view.name==="set" || view.name==="pset") && view.set===s) render();
  }
}
function top3HTML(s, lang, owned){
  const mineMap = new Map(); for(const [num, l] of owned){ const v = Math.max(0, ...l.map(e=>+e.val||0)); if(v>0) mineMap.set(num, v); }
  const mine = [...mineMap].sort((a,b)=>b[1]-a[1]).slice(0,3), canMine = mine.length>=3;
  let mode = top3Mode || (canMine ? "mine" : "set"); if(mode==="mine" && !canMine) mode = "set";
  let list = null, body = "";
  if(mode==="mine") list = mine.map(([num,v])=>({num, v, own:true}));
  else {
    const sp = setPrices(s);
    if(spLoading && spLoading.id===s.id) body = `<p class="hint t3msg" id="t3-prog">Preise werden geladen … ${spLoading.done} / ${spLoading.total}</p>`;
    else if(!sp) body = `<button class="btn t3load" type="button" id="t3-load">Wertvollste Karten des Sets laden</button><p class="hint t3msg">Lädt einmal die Preise aller ${s.cards.length} Karten.</p>`;
    if(sp){ list = Object.entries(sp.p).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([num,v])=>({num, v, own: owned.has(num)})); if(sp.d !== todayISO() && !spLoading) setTimeout(()=>loadSetPrices(s, lang), 1500); }
  }
  if(list && list.length){
    const ord = [list[1], list[0], list[2]].map((x,i)=>x && {...x, rank: i===1 ? 1 : i===0 ? 2 : 3}).filter(Boolean);
    body = `<div class="t3row">${ord.map(x=>{ const c = cardAt(s.id, x.num); if(!c) return ""; return `<button class="t3c${x.rank===1?" first":""}${x.own?"":" miss"}" type="button" data-t3c="${esc(x.num)}" aria-label="Platz ${x.rank}: ${esc(cardTitleFor(s,c))}, ${eur(x.v)}"><span class="t3img">${cimg(s, x.num, "low", "cimg", lang ? LANGNAME[lang] : undefined)}<i>${x.rank}</i></span><b>${eur(x.v)}</b><small>${esc(cardTitleFor(s,c))}${x.own?"":" · fehlt"}</small></button>`; }).join("")}</div>` + body;
  }

const scrim = $("#scrim"), sheets = [];
const DESK = matchMedia("(min-width: 900px)");
const topSheet = () => sheets.filter(x=>x.state!=="closed").sort((a,b)=>(+a.el.style.zIndex||0)-(+b.el.style.zIndex||0)).pop();
const anySheet = () => sheets.some(x=>x.state!=="closed" && !x.isPanel());
function makeSheet(el, opt = {}){
  const sc = el.querySelector(".sheet-scroll");
  const S = {el, sc, state:"closed", onClose: opt.onClose};
  S.isPanel = () => !!opt.panel && DESK.matches;
  sheets.push(S);
  const H = () => el.getBoundingClientRect().height || window.innerHeight;
  const halfY = () => { const h = H(); const content = (sc.firstElementChild?.offsetHeight || sc.scrollHeight) + 26 + 24; let y = opt.half ? opt.half(S, h) : h - content; return Math.round(Math.max(0, Math.min(h * 0.62, y))); };
  S.y = 0;
  S.set = st => {
    if(S.isPanel()){
      if(st==="half") st = "full";
      S.state = st; S.y = 0; el.classList.remove("half");
      el.style.transform = st==="closed" ? "translateX(100%)" : "translateX(0)";
      document.body.classList.toggle("panel", st!=="closed");
      return;
    }
    let y = st==="full" ? 0 : st==="half" ? halfY() : null;
    if(st==="half" && y < 24){ st = "full"; y = 0; }
    S.state = st; S.y = y ?? 0;
    el.classList.toggle("half", st==="half");
    el.style.transform = st==="closed" ? "translateY(100%)" : `translateY(${y}px)`;
  };
  S.open = (st = "half") => {
    if(S.state!=="closed"){ sc.scrollTop = 0; return; }
    const panel = S.isPanel();
    el.hidden = false; if(!panel){ scrim.hidden = false; document.body.classList.add("locked"); }
    sc.scrollTop = 0; el.style.zIndex = 52 + sheets.filter(x=>x.state!=="closed").length;
    S.state = "opening";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ if(!panel) scrim.classList.add("on"); S.set(window.innerHeight < 560 ? "full" : st); }));
  };
  S.close = () => {
    if(S.state==="closed") return;
    S.set("closed");
    if(!anySheet()){ scrim.classList.remove("on"); if(!album.open) document.body.classList.remove("locked"); }
    if(S.isPanel()) markSel(null);
    S.onClose?.();
    setTimeout(()=>{ if(S.state==="closed"){ el.hidden = true; if(!anySheet()) scrim.hidden = true; } }, 330);
  };
  el.querySelector("[data-sheet-close]")?.addEventListener("click", S.close);
  let sd = null;
  el.addEventListener("touchstart", e=>{
    if(S.state==="closed" || S.isPanel()) return;
    sd = {y0:e.touches[0].clientY, base:S.y, dy:0, onGrab:!!e.target.closest(".grab"), live:false, scrolled:false, wasHalf:S.state==="half"};
  },{passive:true});
  el.addEventListener("touchmove", e=>{
    if(!sd) return;
    const dy = e.touches[0].clientY - sd.y0;
    if(!sd.live){
      if(Math.abs(dy) < 8) return;
      if(S.state==="full" && !sd.onGrab && (dy < 0 || sc.scrollTop > 0)){ sd = null; return; }
      sd.live = true; el.classList.add("drag");
    }
    e.preventDefault();
    sd.dy = dy;
    const y = sd.base + dy;
    if(y < 0 && sd.wasHalf){
      if(S.state!=="full"){ S.state = "full"; S.y = 0; el.classList.remove("half"); el.style.transform = "translateY(0)"; }
      sc.scrollTop = -y; sd.scrolled = true;
    } else el.style.transform = `translateY(${Math.max(0, y)}px)`;
  },{passive:false});
  el.addEventListener("touchend", ()=>{
    if(!sd) return;
    const {dy, live, scrolled, wasHalf} = sd; sd = null; el.classList.remove("drag");
    if(!live) return;
    if(scrolled) return;
    if(wasHalf){ if(dy < -50) S.set("full"); else if(dy > 70) S.close(); else S.set("half"); }
    else { if(dy > 140) S.close(); else if(dy > 60 && halfY() > 24) S.set("half"); else if(dy > 60) S.close(); else S.set("full"); }
  });
  sc.addEventListener("scroll", ()=>{ if(S.state==="half" && sc.scrollTop>0) S.set("full"); }, {passive:true});
  el.addEventListener("wheel", e=>{ if(S.state==="half" && e.deltaY>0) S.set("full"); }, {passive:true});
  window.addEventListener("resize", ()=>{ if(S.state==="half" || S.state==="full") S.set(S.state); });
  return S;
}

async function updatePrices(s){
  const btn = $(s ? "#upd-prices" : "#upd-all"), out = () => $(s ? "#upd-msg" : "#val-msg");
  const keys = [...new Set(cards.filter(c => c.setId && SET.has(c.setId) && (!s || c.setId === s.id)).map(c => c.setId + "|" + c.num))];
  if(btn) btn.disabled = true;
  let done = 0, failed = 0, stand = "";
  const queue = keys.slice();
  const worker = async () => { while(queue.length){ const k = queue.shift(); const [sid, num] = k.split("|"); try{ const i = await cardInfo(SET.get(sid), num, false); lastInfo.set(k,i); applyPrices(sid, num, i); recordVariants(k, i); if(i.price?.updated) stand = i.price.updated; }catch{ failed++; } done++; if(out()) out().textContent = `Lade Preise … ${done}/${keys.length}`; } };
  await Promise.all([worker(), worker(), worker(), worker()]);
  render();
  if(out()) out().textContent = `${keys.length - failed} Karten aktualisiert${stand ? `, Stand ${deDate(stand)}` : ""}${failed ? ` · ${failed} ohne Antwort` : ""}.`;
}

async function autoPrices(force){

  if(!keys.length) return;
  Object.assign(AP, {run:true, done:0, total:keys.length}); apProg();
  const queue = keys.slice(); let ok = 0;
  const worker = async () => { while(queue.length){ const k = queue.shift(); const [sid, num] = k.split("|"); try{ const s = SET.get(sid), en = cards.some(c=>c.setId===sid && c.num===num && c.lang==="Englisch") && !cards.some(c=>c.setId===sid && c.num===num && c.lang==="Deutsch"); const i = await cardInfo(s, num, en); lastInfo.set(k,i); applyPrices(sid, num, i); recordVariants(k, i); ok++; }catch{} AP.done++; if(AP.done % 10 === 0 || AP.done === AP.total) apProg(); } };

async function exportBackup(){
  const iso = new Date().toISOString();
  const data = JSON.stringify({app:"kartenalbum", version:2, exported:iso, cards, albums, settings, wish, valHist, notes, ach}, null, 1);
  const name = `kartenalbum-${deDate(iso)}.json`;
  const file = new File([data], name, {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:"Kartenalbum-Sicherung"});
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); }
    LS.put("pk-lastbackup", iso.slice(0,10)); render();
    $("#bk-msg").textContent = `Sicherung „${name}“ erstellt.`;
  }catch(err){ if(err?.name!=="AbortError") $("#bk-msg").textContent = "Export fehlgeschlagen: " + (err?.message||err); }
}
async function importBackup(e){
  const f = e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(d.app!=="kartenalbum" || !Array.isArray(d.cards) || !Array.isArray(d.albums)) throw new Error("Das ist keine Kartenalbum-Sicherung.");
    const before = sum(cards,qtyOf), ids = new Set(cards.map(x=>x.id));
    cards = migrate([...cards, ...d.cards.filter(c=>c && !ids.has(c.id))]);
    const al = new Map(albums.map(a=>[a.id,a])); d.albums.forEach(a=>{ if(a && a.id) al.set(a.id,a); }); albums = [...al.values()];
    if(d.settings) settings = {...settings, ...d.settings};
    if(d.wish) wish = {...d.wish, ...wish};
    if(d.valHist) valHist = {...d.valHist, ...valHist};
    if(d.notes) notes = {...d.notes, ...notes};
    if(d.ach) ach = {...d.ach, ...ach};
    LS.set("pk-wish", wish); LS.set("pk-valhist", valHist); LS.set("pk-notes", notes); LS.set("pk-ach", ach);
    saveCards(); LS.set("pk-albums",albums); LS.set("pk-settings",settings); render();
    $("#bk-msg").textContent = `Import vom ${deDate(d.exported)}: ${sum(cards,qtyOf)-before} Karten hinzugekommen.`;
  }catch(err){ $("#bk-msg").textContent = "Import fehlgeschlagen: " + (err?.message||err); }
}

(function(){
  const wrap = document.querySelector(".wrap"), hint = $("#edge-hint");
  let sw = null;
  document.addEventListener("touchstart", e=>{
    if(view.name!=="set" || anySheet() || album.open) return;
    const t = e.touches[0];
    if(t.clientX > 28) return;
    sw = {x0:t.clientX, y0:t.clientY, dx:0, live:false};
  },{passive:true});
  document.addEventListener("touchmove", e=>{
    if(!sw) return;
    const t = e.touches[0], dx = t.clientX - sw.x0, dy = t.clientY - sw.y0;
    if(!sw.live){ if(Math.abs(dy) > 30 && Math.abs(dy) > dx){ sw = null; return; } if(dx < 10) return; sw.live = true; wrap.classList.add("swiping"); }
    e.preventDefault();
    sw.dx = Math.max(0, dx);
    wrap.style.transform = `translateX(${Math.min(sw.dx, window.innerWidth) * 0.6}px)`;
    hint.style.opacity = Math.min(1, sw.dx/100);
  },{passive:false});
  document.addEventListener("touchend", ()=>{
    if(!sw) return;
    const go_ = sw.live && sw.dx > 90; sw = null;
    wrap.classList.remove("swiping"); wrap.style.transform = ""; hint.style.opacity = 0;
    if(go_) goBack();
  });
})();

const album = {open:false, set:null, lang:null, owned:null, page:0, auto:false, busy:false, idleT:0};
const alEl = $("#album"), alStage = $("#al-stage");
const isLand = () => window.innerWidth > window.innerHeight;
const isTouch = () => matchMedia("(pointer: coarse)").matches;
const isMouse = () => matchMedia("(hover: hover) and (pointer: fine)").matches;
const per = () => isLand() ? 2 : 1;
const pageCount = () => Math.ceil(album.set.cards.length / 9);
function firstVisiblePage(s){
  const top = 120;
  for(const el of document.querySelectorAll("#view .slot[data-num]")){
    if(el.getBoundingClientRect().bottom > top){ const i = s.idx.get(el.dataset.num); return i==null ? 0 : Math.floor(i/9); }
  }

}
function aPageHTML(i){
  const s = album.set, ch = s.cards.slice(i*9, i*9+9);
  if(!ch.length) return `<section class="apage blank" aria-hidden="true"></section>`;
  const fill = Array.from({length: 9-ch.length}, ()=>`<span class="pk-empty"></span>`).join("");
  return `<section class="apage" aria-label="Seite ${i+1}"><h3><span>Seite ${i+1}</span><span>${esc(ch[0][0])}–${esc(ch[ch.length-1][0])}</span></h3><div class="pockets">${ch.map(c=>slotSet(s,c,album.owned.get(c[0]),true)).join("")}${fill}</div></section>`;
}
const pageCache = new Map();
function getPage(i){
  let el = pageCache.get(i);
  if(el) return el;
  const tmp = document.createElement("div"); tmp.innerHTML = aPageHTML(i);
  el = tmp.firstElementChild;
  el.querySelectorAll("img").forEach(im=>{ im.loading = "eager"; });
  pageCache.set(i, el);
  return el;
}
function preload(){
  const k = per(), n = pageCount();
  for(let i = album.page - 2*k; i < album.page + 3*k; i++) if(i>=0 && i<n) getPage(i);
}
function role(el, r){ el.classList.toggle("lp", r==="l"); el.classList.toggle("rp", r==="r"); return el; }
function blankPage(){ const d = document.createElement("section"); d.className = "apage blank"; return d; }
function alLayout(){
  const land = isLand(); alEl.classList.toggle("land", land && isTouch());
  const W = alStage.clientWidth - (land ? 16 : 24), H = alStage.clientHeight - (land ? 12 : 16);
  const n = per(), g = land ? 5 : 7, padX = 30, padY = 20, hd = 20;
  let cw = Math.min((W/n - padX - 2*g)/3, ((H - padY - hd - 2*g)/3) * 63/88);
  cw = Math.max(40, Math.floor(cw));
  const chh = cw*88/63;
  alEl.style.setProperty("--cw", cw+"px"); alEl.style.setProperty("--g", g+"px");
  alEl.style.setProperty("--pw", (3*cw + 2*g + padX)+"px"); alEl.style.setProperty("--ph", Math.ceil(3*chh + 2*g + padY + hd)+"px");
}
function alInfo(){
  const n = pageCount(), p = album.page, two = per()===2;
  $("#al-pg").textContent = two ? `${p+1}${p+2<=n?"–"+(p+2):""} / ${n}` : `${p+1} / ${n}`;
  const r = $("#al-range"); r.max = Math.ceil(n/per()); r.value = Math.floor(p/per())+1;

function alRender(rebuild){
  if(rebuild || !album.owned){ album.owned = setOwned(album.set, album.lang); pageCache.clear(); }
  const two = per()===2, sp = document.createElement("div");
  sp.className = "spread" + (two ? " two" : "");

function wake(){
  alEl.classList.remove("idle"); clearTimeout(album.idleT);

function openAlbum(s, page, auto){

function closeAlbum(scroll = true){

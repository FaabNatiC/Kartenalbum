    <div class="acct-btns"><button class="btn primary" type="button" id="ac-in">Anmelden</button><button class="btn" type="button" id="ac-up">Registrieren</button><button class="lnk" type="button" id="ac-reset">Passwort vergessen?</button></div>
    <div class="acct-or"><span>oder</span></div>
    <button class="btn gbtn" type="button" id="ac-google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.7 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Mit Google anmelden</button>
    <p class="sfoot" id="ac-msg">Mit Konto wird deine Sammlung zwischen deinen Geräten abgeglichen. Ohne Anmeldung bleibt alles nur auf diesem Gerät.</p>`;
  if(!u.emailVerified) return `<div class="group"><div class="srow"><span class="lbl">Angemeldet als</span><span class="val">${esc(u.email)}</span></div></div>
    <div class="acct-btns"><button class="btn primary" type="button" id="ac-ver">Ich habe bestätigt</button><button class="btn" type="button" id="ac-resend">Mail erneut senden</button><button class="lnk" type="button" id="ac-out">Abmelden</button></div>
    <p class="sfoot" id="ac-msg">Bitte bestätige zuerst deine E-Mail-Adresse über den Link in der Mail (auch im Spam-Ordner nachsehen). Danach startet der Abgleich.</p>`;
  return `<div class="group"><div class="srow"><span class="lbl">Angemeldet als</span><span class="val">${esc(u.email)}</span></div>
      <button class="srow act" type="button" id="ac-sync"><span class="lbl">Jetzt abgleichen</span></button>
      <button class="srow act" type="button" id="ac-out"><span class="lbl">Abmelden</span></button></div>
    <p class="sfoot" id="sync-status">${esc(syncText())}</p>`;
}
function bindKonto(){
  if(!FIREBASE_CONFIG) return;
  if(!Sync.fb){ startAuth(); return; }
  const {Au, auth} = Sync.fb, msg = t => { const m = $("#ac-msg"); if(m) m.textContent = t; };
  const creds = () => [$("#ac-mail").value.trim(), $("#ac-pw").value];
  const busyBtn = async (b, fn) => { b.disabled = true; try{ await fn(); }catch(e){ msg(authMsg(e)); } finally { b.disabled = false; } };
  const signIn = () => busyBtn($("#ac-in"), async()=>{ const [m,p] = creds(); await Au.signInWithEmailAndPassword(auth, m, p); });
  $("#acct-f")?.addEventListener("submit", e=>{ e.preventDefault(); signIn(); });
  $("#ac-in")?.addEventListener("click", signIn);
  $("#ac-google")?.addEventListener("click", e=>busyBtn(e.currentTarget, async()=>{
    try{ await Au.signInWithPopup(auth, new Au.GoogleAuthProvider()); }
    catch(err){
      const c = err?.code || "";
      if(c==="auth/popup-closed-by-user" || c==="auth/cancelled-popup-request") return;
      if(c==="auth/account-exists-with-different-credential") throw {code:c};
      msg("Die Google-Anmeldung hat hier nicht geklappt" + (window.matchMedia("(display-mode: standalone)").matches ? " – in der App vom Home-Bildschirm bitte E-Mail und Passwort nutzen." : ` (${c||"Fehler"}). Bitte E-Mail und Passwort nutzen.`));
    }
  }));
  $("#ac-up")?.addEventListener("click", e=>busyBtn(e.currentTarget, async()=>{ const [m,p] = creds(); const r = await Au.createUserWithEmailAndPassword(auth, m, p); await Au.sendEmailVerification(r.user); }));
  $("#ac-reset")?.addEventListener("click", e=>busyBtn(e.currentTarget, async()=>{ const [m] = creds(); if(!m){ msg("Bitte zuerst die E-Mail-Adresse eingeben."); return; } await Au.sendPasswordResetEmail(auth, m); msg("Mail zum Zurücksetzen des Passworts ist unterwegs."); }));
  $("#ac-resend")?.addEventListener("click", e=>busyBtn(e.currentTarget, async()=>{ await Au.sendEmailVerification(auth.currentUser); msg("Bestätigungs-Mail wurde erneut gesendet."); }));
  $("#ac-ver")?.addEventListener("click", e=>busyBtn(e.currentTarget, async()=>{
    await auth.currentUser.reload(); await auth.currentUser.getIdToken(true);
    Sync.user = auth.currentUser;
    if(Sync.user.emailVerified){ render(); beginSync(); } else msg("Noch nicht bestätigt – bitte auf den Link in der Mail tippen.");
  }));
  $("#ac-sync")?.addEventListener("click", ()=>beginSync());
  $("#ac-out")?.addEventListener("click", async()=>{ stopListen(); clearTimeout(Sync.pushT); try{ await Au.signOut(auth); }catch{} });
}
window.addEventListener("online", ()=>{ if(Sync.user?.emailVerified) beginSync(); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && Sync.user?.emailVerified) syncDirty(); });

/* ---------- Start ---------- */
function init(){
  applyTheme();
  albums = LS.get("pk-albums", []);
  settings = {...settings, ...LS.get("pk-settings", {})};
  const raw = LS.get("pk-cards", []);
  cards = migrate(raw);
  if(JSON.stringify(cards) !== JSON.stringify(raw)) saveCards();
  if(!LS.raw("pk-seen") && !cards.length) LS.put("pk-seen", APP_VERSION);
  window.addEventListener("hashchange", route);
  route();
  if(!LS.works()) setStatus("Dieser Browser blockiert das Speichern (z. B. privater Modus). Öffne das Album normal oder vom Home-Bildschirm.");
  try{ navigator.storage?.persist?.(); }catch{}
  if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
  updatedNotice();
  setTimeout(checkUpdate, 1500);
  if(FIREBASE_CONFIG && LS.raw("pk-syncuid")) startAuth();
}
init();
</script>
